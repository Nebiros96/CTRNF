<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTRNF · Último registro</title>
  <link rel="stylesheet" href="pb.css">
</head>
<body data-card="last">
  <!-- OBS: /streaming/last.html · 420 × 100 · fondo transparente -->
  <article id="overlay" class="card" hidden>
    <header class="head">
      <div id="track" class="track"></div>
      <div id="delta" class="delta"></div>
    </header>
    <div class="body">
      <div class="portrait"><img id="skin" alt="" width="34" height="34"></div>
      <div class="identity">
        <div class="who"><span id="character"></span><span id="skin-name"></span></div>
        <div id="date" class="when"></div>
      </div>
      <div class="times">
        <div class="row">
          <span class="tag">ÚLT</span>
          <span id="time" class="clock">—</span>
        </div>
        <div id="count" class="count"></div>
      </div>
    </div>
  </article>
  <script src="overlay.js"></script>
</body>
</html>
